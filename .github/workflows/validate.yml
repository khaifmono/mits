name: Validate tools.json

on:
  pull_request:
    paths:
      - 'data/tools.json'
  push:
    branches: [main]
    paths:
      - 'data/tools.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-tools.mjs
