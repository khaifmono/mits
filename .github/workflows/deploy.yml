name: Deploy

# Commit → auto-update: every push to main deploys the suggest worker and the site to Cloudflare.
# Steps self-skip until the repository secrets exist, so the first pushes stay green.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `secrets` context is not allowed inside step/job `if` — pass it via env and branch in bash.
      - id: gate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ——— suggest worker (worker/wrangler.jsonc) ———
      - uses: cloudflare/wrangler-action@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      # ——— site (root wrangler.jsonc: Worker + static assets) ———
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'
      - run: pnpm build
        if: steps.gate.outputs.ready == 'true'
        env:
          PUBLIC_SUGGEST_API_URL: ${{ vars.PUBLIC_SUGGEST_API_URL }}
          PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL }}
      - uses: cloudflare/wrangler-action@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
